name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Swift ${{ matrix.swift }} on Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.3"
            xcode: "26.6"
            runs-on: macos-26
          - swift: "6.4"
            xcode: "27.0"
            runs-on: xcode-27

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
